  <title>Tracaus</title>
  <defs>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="268" y1="0" x2="476" y2="0">
      <stop offset="0" stop-color="#0b64fb"/>
      <stop offset="1" stop-color="#6e3cfa"/>
    </linearGradient>
    <style>
      .trace { fill: none; stroke-width: 24; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: draw 1.1s cubic-bezier(.45, .05, .2, 1) forwards; }
      .t0 { animation-delay: .25s; } .t1 { animation-delay: .4s; } .t2 { animation-delay: .55s; }
      .node { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.2, .9, .3, 1.3) forwards; }
      .n0 { animation-delay: 0s; } .n1 { animation-delay: .12s; } .n2 { animation-delay: .24s; }
      .ring { fill: none; stroke: url(#ring); stroke-width: 40; stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: draw .9s cubic-bezier(.4, 0, .2, 1) 1s forwards; }
      .dot { opacity: 0; transform-box: fill-box; transform-origin: center;
        animation: pop .7s cubic-bezier(.17, .89, .28, 1.28) 1.7s forwards, breathe 3.2s ease-in-out 2.6s infinite; }
      .halo { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ping 3.2s ease-out 2.6s infinite; }
      .pulse { fill: none; stroke: #fff; stroke-width: 12; stroke-linecap: round; stroke-dasharray: .07 3;
        stroke-dashoffset: .07; opacity: 0; animation: signal 5s ease-in-out 3s infinite; }
      .p1 { animation-delay: 3.15s; } .p2 { animation-delay: 3.3s; }
      .letter { opacity: 0; animation: rise .6s cubic-bezier(.2, .8, .2, 1) forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes pop { 0% { opacity: 0; transform: scale(.2); } 60% { opacity: 1; transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
      @keyframes ping { 0% { opacity: .5; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2); } }
      @keyframes signal { 0% { opacity: 0; stroke-dashoffset: .07; } 4% { opacity: .85; }
        26% { opacity: .85; stroke-dashoffset: -1; } 30%, 100% { opacity: 0; stroke-dashoffset: -1; } }
      @media (prefers-reduced-motion: reduce) {
        .trace, .ring, .node, .dot, .letter { animation: none !important; opacity: 1; stroke-dashoffset: 0; transform: none; }
        .halo, .pulse { animation: none !important; opacity: 0; }
      }
    </style>
